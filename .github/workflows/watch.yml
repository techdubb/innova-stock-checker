name: Restock watcher

on:
  schedule:
    # Every 5 minutes (GitHub's minimum), offset from :00 when GitHub is busiest.
    # GitHub may still delay or skip runs under load; expect 5-20 min gaps.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Never let two checks overlap (they'd race on state.json).
concurrency:
  group: restock-watcher
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: state.json
          # Each run is one check, minutes apart, so requiring 2 in-stock reads
          # would delay the alert by a whole extra run. All four page signals
          # must already agree before anything counts as in stock.
          CONFIRMATIONS: "1"
        run: python watcher.py --once

      - name: Persist state if it changed
        if: always()
        run: |
          git add -N state.json 2>/dev/null || true
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "restock-watcher-bot"
          git config user.email "restock-watcher-bot@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update watcher state [skip ci]"
          git pull --rebase --quiet
          git push
